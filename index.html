<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MarketPilot Desk</title>
<style>
:root {
  color-scheme: light;
  --color-bg: #f7f6f2; --color-panel: #ffffff; --color-fg: #1f1e1d; --color-fg-muted: #6b6a64;
  --color-border-line: rgba(31, 30, 29, 0.12); --color-ok: #2e7d32; --color-warn: #a86200; --color-bad: #c63d3d;
  --cds-chart-axis: #c3c2b7; --cds-chart-grid: rgba(31, 30, 29, 0.08); --cds-chart-muted: #c3c2b7;
  --cds-chart-reference: #898781; --cds-chart-status-critical: #d03b3b;
  --cds-surface-popover: #ffffff; --cds-border: rgba(31, 30, 29, 0.12); --cds-text-secondary: #6b6a64;
  --cds-shadow-popover: 0 8px 24px #0000001f, 0 2px 6px #00000014;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6; --series-8: #e34948;
  --cds-gap-lg: 1.25rem; --cds-gap-md: .75rem; --cds-gap-sm: .5rem; --cds-gap-xs: .375rem;
  --cds-radius: .5rem; --cds-pad-lg: 1rem; --cds-pad-md: .75rem; --cds-pad-sm: .5rem; --cds-pad-xs: .25rem;
  --cds-font-size-caption: .75rem; --cds-font-size-body: .875rem; --cds-font-size-heading: .9375rem;
  --cds-font-size-title: 1.375rem; --cds-font-weight-medium: 500; --cds-dur-slow: .45s;
  --font-anthropic-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", sans-serif;
  --font-anthropic-serif: ui-serif, "New York", Georgia, "Times New Roman", "Songti SC", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --color-bg: #1c1b1a; --color-panel: #262624; --color-fg: #f3f2ee; --color-fg-muted: #a3a29b;
    --color-border-line: rgba(243, 242, 238, 0.12); --color-ok: #6cc070; --color-warn: #e0a43a; --color-bad: #ef7b7b;
    --cds-chart-axis: #5f5e5a; --cds-chart-grid: rgba(243, 242, 238, 0.09); --cds-chart-muted: #5f5e5a;
    --cds-chart-reference: #97958d; --cds-chart-status-critical: #e66767;
    --cds-surface-popover: #30302e; --cds-border: rgba(243, 242, 238, 0.14); --cds-text-secondary: #a3a29b;
    --cds-shadow-popover: 0 8px 24px #00000052, 0 2px 6px #0003;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #2f9a2f; --series-7: #9085e9; --series-8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --color-bg: #1c1b1a; --color-panel: #262624; --color-fg: #f3f2ee; --color-fg-muted: #a3a29b;
  --color-border-line: rgba(243, 242, 238, 0.12); --color-ok: #6cc070; --color-warn: #e0a43a; --color-bad: #ef7b7b;
  --cds-chart-axis: #5f5e5a; --cds-chart-grid: rgba(243, 242, 238, 0.09); --cds-chart-muted: #5f5e5a;
  --cds-chart-reference: #97958d; --cds-chart-status-critical: #e66767;
  --cds-surface-popover: #30302e; --cds-border: rgba(243, 242, 238, 0.14); --cds-text-secondary: #a3a29b;
  --cds-shadow-popover: 0 8px 24px #00000052, 0 2px 6px #0003;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --series-5: #d55181; --series-6: #2f9a2f; --series-7: #9085e9; --series-8: #e66767;
}
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--color-bg); color: var(--color-fg); font: 14px/1.5 var(--font-anthropic-sans); }
#dash-root { padding: 0 clamp(16px, 3vw, 32px) 32px; }
.dash-skeleton { color: var(--color-fg-muted); }
.desk-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; align-items: center;
  gap: 8px 16px; padding: 10px clamp(16px, 3vw, 32px); background: var(--color-bg); border-bottom: 1px solid var(--color-border-line);
  font-size: 12px; color: var(--color-fg-muted); margin-bottom: 16px; }
.desk-bar b { color: var(--color-fg); font-weight: 600; font-size: 13px; }
.desk-bar .sp { flex: 1; }
.desk-bar button { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--color-border-line);
  background: var(--color-panel); color: var(--color-fg); cursor: pointer; }
.desk-stale { color: var(--color-warn); }
#lock { min-height: 70vh; display: grid; place-items: center; padding: 24px 16px; }
#lock form { width: min(100%, 22rem); display: grid; gap: 12px; background: var(--color-panel); border: 1px solid var(--color-border-line);
  border-radius: 12px; padding: 24px; }
#lock h1 { font: 400 22px/1.2 var(--font-anthropic-serif); margin: 0; }
#lock p { margin: 0; color: var(--color-fg-muted); font-size: 13px; }
#lock input[type=password] { font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--color-border-line);
  background: var(--color-bg); color: var(--color-fg); }
#lock label { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--color-fg-muted); }
#lock button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 0; background: var(--color-fg); color: var(--color-bg); cursor: pointer; }
#lock .err { color: var(--color-bad); min-height: 1.2em; }
#desk-sources { padding: 0 clamp(16px, 3vw, 32px) 32px; font-size: 12px; color: var(--color-fg-muted); }
#desk-sources details { max-width: 1200px; margin: 0 auto; }
#desk-sources table { border-collapse: collapse; width: 100%; margin-top: 8px; }
#desk-sources td { padding: 4px 8px; border-top: 1px solid var(--color-border-line); vertical-align: top; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
</head>
<body>
<div class="desk-bar" id="desk-bar" hidden>
  <b>MarketPilot Desk</b>
  <span id="desk-asof"></span>
  <span class="sp"></span>
  <button type="button" id="desk-reload">刷新数据</button>
  <button type="button" id="desk-lock">锁定</button>
</div>
<div id="lock">
  <form id="lock-form" autocomplete="off">
    <h1>MarketPilot Desk</h1>
    <p>数据已加密。输入密码解锁。</p>
    <input type="password" id="lock-pw" placeholder="密码" autocomplete="current-password" required>
    <label><input type="checkbox" id="lock-remember" checked> 在这台设备上记住</label>
    <button type="submit" id="lock-go">解锁</button>
    <div class="err" id="lock-err" role="alert"></div>
  </form>
</div>
<div id="dash-root" hidden></div>
<footer id="desk-sources" hidden></footer>
<script>
(() => {
  "use strict";
  const KEY_STORE = "mpdesk.key.";   // + salt; holds the derived AES key (raw, base64) when "remember" is ticked
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const tob64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };

  // ------------------------------------------------------------------ minimal "dash" runtime for the page
  const S = { data: {}, calcs: {}, fns: [], loaded: false };
  const empty = (status, message) => ({ status, data: [], rows: [], columns: [], value: null, meta: [], refreshing: false, message: message || "" });
  const ok = (d) => {
    const rows = Array.isArray(d) ? d : [];
    return { status: "ok", data: d, rows, columns: rows.length ? Object.keys(rows[0]) : [], value: d, meta: [], refreshing: false, message: "" };
  };
  const dash = {
    colors: [1, 2, 3, 4, 5, 6, 7, 8].map((i) => `var(--series-${i})`),
    data(id) {
      if (S.calcs[id]) {
        const c = S.calcs[id], ins = c.inputs.map((i) => dash.data(i));
        const bad = ins.find((x) => x.status !== "ok");
        if (bad) return empty(bad.status);
        try { return ok(c.fn(...ins.map((x) => x.data))); } catch (e) { return empty("error", String(e)); }
      }
      if (!(id in S.data)) return empty(S.loaded ? "missing" : "loading");
      return ok(S.data[id]);
    },
    onData(fn) { S.fns.push(fn); try { fn(); } catch (e) { console.error(e); } },
    calc(id, spec) { S.calcs[id] = spec; },
    loader() {},
    setLink(name) { try { history.replaceState(null, "", "#" + name); } catch (e) {} },
    params() { return {}; }, setParams() {}, resetParams() {},
    refresh() { load(true); },
  };
  window.dash = dash;
  const redraw = () => S.fns.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } });
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(redraw, 150); });

  const rowsOf = (x) => {
    if (Array.isArray(x)) return x;
    if (x && typeof x === "object") for (const k of ["rows", "data", "results"]) if (Array.isArray(x[k])) return x[k];
    return x;
  };

  // ------------------------------------------------------------------ decryption (AES-GCM, PBKDF2-SHA256)
  let ENC = null, KEY = null, PAGE_DONE = false;
  async function fetchEnc() {
    const r = await fetch("data.enc.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("data file HTTP " + r.status);
    return r.json();
  }
  async function deriveKey(pw, enc) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function decrypt(key, enc) {
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  // ------------------------------------------------------------------ page injection and data
  function injectPage(html) {
    const root = document.getElementById("dash-root");
    const tpl = document.createElement("template");
    tpl.innerHTML = html;
    const scripts = [...tpl.content.querySelectorAll("script")];
    scripts.forEach((s) => s.remove());
    root.replaceChildren(tpl.content);
    for (const s of scripts) {          // each page script in its own scope, in order (as the dashboard type runs them)
      const el = document.createElement("script");
      el.textContent = "(() => {\n" + s.textContent + "\n})();";
      document.body.appendChild(el);
    }
  }
  function fmtTime(s) {
    if (!s) return "—";
    const d = new Date(s); if (isNaN(d)) return String(s);
    return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }
  function showSources(bundle) {
    const f = document.getElementById("desk-sources");
    const rows = Object.entries(bundle.datasets).map(([id, d]) => {
      const age = d.updated ? (Date.now() - new Date(d.updated)) / 36e5 : null;
      const stale = age != null && d.staleAfterHours && age > d.staleAfterHours;
      return `<tr><td>${esc(d.title || id)}</td><td class="${stale ? "desk-stale" : ""}">${esc(fmtTime(d.updated))}${stale ? " · 已过期" : ""}</td><td>${esc(d.description || "")}</td></tr>`;
    }).join("");
    f.innerHTML = `<details><summary>数据来源与更新时间</summary><table>${rows}</table></details>`;
    f.hidden = false;
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function apply(bundle) {
    S.data = {};
    for (const [id, d] of Object.entries(bundle.datasets)) S.data[id] = rowsOf(d.rows);
    S.loaded = true;
    document.getElementById("lock").hidden = true;
    document.getElementById("dash-root").hidden = false;
    document.getElementById("desk-bar").hidden = false;
    document.getElementById("desk-asof").textContent = "更新于 " + fmtTime(bundle.generated_at);
    document.title = bundle.title || "MarketPilot Desk";
    if (!PAGE_DONE) { injectPage(bundle.page); PAGE_DONE = true; } else redraw();
    showSources(bundle);
  }

  async function load(force) {
    try {
      ENC = await fetchEnc();
      if (!KEY) {
        const saved = store.get(KEY_STORE + ENC.salt);
        if (saved) KEY = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", true, ["decrypt"]);
      }
      if (KEY) apply(await decrypt(KEY, ENC));
    } catch (e) {
      console.error(e);
      if (KEY && !PAGE_DONE) { KEY = null; store.del(KEY_STORE + (ENC && ENC.salt)); }   // stale saved key: ask again
      if (!PAGE_DONE) document.getElementById("lock-err").textContent = ENC ? "" : "读取数据失败：" + e.message;
    }
  }

  document.getElementById("lock-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const err = document.getElementById("lock-err"), btn = document.getElementById("lock-go");
    err.textContent = ""; btn.disabled = true; btn.textContent = "解锁中…";
    try {
      if (!ENC) ENC = await fetchEnc();
      const key = await deriveKey(document.getElementById("lock-pw").value, ENC);
      const bundle = await decrypt(key, ENC);
      KEY = key;
      if (document.getElementById("lock-remember").checked) store.set(KEY_STORE + ENC.salt, tob64(await crypto.subtle.exportKey("raw", key)));
      document.getElementById("lock-pw").value = "";
      apply(bundle);
    } catch (e) {
      err.textContent = ENC ? "密码不对，或数据还没准备好。" : "读取数据失败：" + e.message;
    } finally { btn.disabled = false; btn.textContent = "解锁"; }
  });
  document.getElementById("desk-reload").addEventListener("click", () => load(true));
  document.getElementById("desk-lock").addEventListener("click", () => {
    if (ENC) store.del(KEY_STORE + ENC.salt);
    location.reload();
  });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && KEY) load(true); });
  setInterval(() => { if (KEY && !document.hidden) load(true); }, 30 * 60 * 1000);
  load(false);
})();
</script>
</body>
</html>
